<!DOCTYPE html>
<html>
<head>
<title>Booking History</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body onload="loadBookingHistory()">
<h2>My Bookings</h2>

<div id="history"></div>

<script>

let userId = localStorage.getItem("userId");

fetch("http://localhost:8080/user/bookings/"+userId)

.then(res=>res.json())

.then(data=>{

let div=document.getElementById("history");

data.forEach(b=>{

div.innerHTML+=`
<p>${b.date} | ${b.startTime} - ${b.endTime}</p>
`;

});

});

</script>
<script src="../js/user.js"></script>

</body>
</html>
