<!DOCTYPE html>
<html>
<head>
<title>Manage Rooms</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body onload="loadRooms()">
<h2>Manage Rooms</h2>
<div id="rooms"></div>

<script>

fetch("http://localhost:8080/admin/rooms")
.then(res=>res.json())
.then(data=>{

console.log(data); // IMPORTANT

let div=document.getElementById("rooms");

div.innerHTML="";

data.forEach(r=>{

div.innerHTML+=`
<div>
<p>${r.roomName}</p>
<p>${r.location}</p>
<p>${r.capacity}</p>
<p>${r.availableDate}</p>
<p>${r.startTime} - ${r.endTime}</p>
</div>
`;

});

});

</script>
