<!DOCTYPE html>
<html>
<head>
<title>All Bookings</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body onload="loadAllBookings()">

<h2>All Bookings</h2>

<div id="bookings"></div>

<script>

fetch("http://localhost:8080/admin/bookings")

.then(res=>res.json())

.then(data=>{

let div=document.getElementById("bookings");

data.forEach(b=>{

div.innerHTML+=`
<p>User: ${b.userId} | Room: ${b.roomId} | Date: ${b.date}</p>
`;

});

});

</script>

<script src="../js/admin.js"></script>

</body>
</html>
